# Same volume through TTK's regions + our boundary saddles (the `ttk` preset, D-005):
# compare out/gauss3d_ttk with out/gauss3d (M1 cross-check). TTK env only.
# For TTK's own saddles too, see gauss3d_ttk_ttk.yaml or add `--saddles ttk`.
name: gauss3d_ttk
dataset:
  type: synthetic
  generator: bumps
  params:
    dims_xyz: [64, 64, 64]
    centers: [[0.3, 0.3, 0.5], [0.7, 0.3, 0.5], [0.5, 0.7, 0.4], [0.5, 0.5, 0.8]]
    heights: [1.0, 0.8, 0.7, 0.5]
    width: 0.1
extremum: maxima
# connectivity: ttk = TTK's grid mesh, so native and TTK runs differ only in method (D-016, D-018).
source: {type: ttk, connectivity: ttk}
output: ../out/gauss3d_ttk
