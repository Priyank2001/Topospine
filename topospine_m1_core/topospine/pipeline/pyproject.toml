[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topospine"
version = "0.1.0"
description = "Extremum graph extraction for web-based topological spines (E0 271 project)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25",   # 1.25+ has the fast ufunc.at path used in steepest ascent
    "scipy>=1.10",   # cKDTree for kNN neighbourhoods
    "pyyaml>=6.0",   # run configs
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]                 # 2-D preview figures
vtk = ["vtk>=9.2"]                        # .vti reading (TTK's conda env already has it)
dev = ["pytest>=7.0", "jsonschema>=4.0", "matplotlib>=3.7"]

[project.scripts]
topospine = "topospine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]          # tests run without `pip install -e .`
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: larger end-to-end checks (deselect with -m 'not slow')"]
